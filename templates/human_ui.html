<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="human-ui-overrides">
    :root {
        --ui-bg: #101417;
        --ui-surface: #171d21;
        --ui-surface-raised: #1d252a;
        --ui-line: #2b353b;
        --ui-line-soft: #222b30;
        --ui-ink: #f2efe8;
        --ui-muted: #98a19f;
        --ui-faint: #6f7a79;
        --ui-accent: #a8d56a;
        --ui-accent-strong: #86b64b;
        --ui-accent-ink: #18210f;
        --ui-warm: #e3aa62;
        --ui-danger: #d77c72;
        --ui-radius: 12px;
        --ui-shadow: 0 18px 44px rgba(0, 0, 0, 0.22);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--ui-bg); }
    body {
        background:
            radial-gradient(circle at 86% 4%, rgba(168, 213, 106, 0.07), transparent 24rem),
            var(--ui-bg) !important;
        color: var(--ui-ink) !important;
        font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
        letter-spacing: 0 !important;
    }
    body::selection { background: rgba(168, 213, 106, 0.28); }
    .bg-grid, .glow-blob { display: none !important; }

    .container {
        width: min(1180px, 100%);
        max-width: none !important;
        padding: 52px 32px 84px !important;
    }
    h1, h2, h3, .page-title {
        color: var(--ui-ink) !important;
        font-family: 'Newsreader', Georgia, serif !important;
        letter-spacing: -0.025em !important;
        font-weight: 600 !important;
    }
    h1 {
        font-size: clamp(2rem, 3vw, 2.8rem) !important;
        line-height: 1.05 !important;
        margin-bottom: 10px !important;
    }
    h2 { font-size: 1.8rem !important; }
    .subtitle, .subheading, .description {
        color: var(--ui-muted) !important;
        line-height: 1.65 !important;
    }

    .card, .panel, .stat-card, .result-box, .table-wrap {
        background: var(--ui-surface) !important;
        border: 1px solid var(--ui-line) !important;
        border-radius: var(--ui-radius) !important;
        box-shadow: var(--ui-shadow) !important;
    }
    .card { padding: 28px !important; margin-bottom: 22px !important; }
    .card-title, .section-title {
        color: var(--ui-ink) !important;
        font-size: 0.96rem !important;
        font-weight: 700 !important;
        letter-spacing: 0.01em !important;
    }
    .card-title::after, .section-title::after {
        content: '';
        display: block;
        width: 28px;
        height: 2px;
        background: var(--ui-accent);
        margin-top: 10px;
        opacity: 0.85;
    }

    label {
        color: var(--ui-muted) !important;
        font-size: 0.71rem !important;
        letter-spacing: 0.09em !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
    }
    input, textarea, select, input[type=text], input[type=password], input[type=email], input[type=number], input[type=url], input[type=file] {
        background: #11181c !important;
        border: 1px solid var(--ui-line) !important;
        border-radius: 8px !important;
        color: var(--ui-ink) !important;
        font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
        box-shadow: none !important;
    }
    input::placeholder, textarea::placeholder { color: var(--ui-faint) !important; }
    input:focus, textarea:focus, select:focus {
        border-color: var(--ui-accent) !important;
        box-shadow: 0 0 0 3px rgba(168, 213, 106, 0.12) !important;
        outline: none !important;
    }
    button, .btn, .btn-primary, .btn-login, .btn-register, .btn-submit {
        background: var(--ui-accent) !important;
        border: 1px solid var(--ui-accent) !important;
        border-radius: 8px !important;
        color: var(--ui-accent-ink) !important;
        font-family: 'DM Sans', 'Segoe UI', sans-serif !important;
        font-weight: 700 !important;
        box-shadow: none !important;
        transition: transform 160ms ease-out, background 160ms ease-out, border-color 160ms ease-out !important;
    }
    button:hover, .btn:hover, .btn-primary:hover, .btn-login:hover, .btn-register:hover, .btn-submit:hover {
        background: var(--ui-accent-strong) !important;
        border-color: var(--ui-accent-strong) !important;
        color: var(--ui-accent-ink) !important;
        opacity: 1 !important;
        transform: translateY(-1px) !important;
    }
    button:active, .btn:active, .btn-primary:active, .btn-login:active, .btn-register:active { transform: scale(0.98) !important; }
    a { color: var(--ui-accent); }
    a:hover { color: #c4e997; }
    hr { border-color: var(--ui-line) !important; }

    table { border-collapse: separate !important; border-spacing: 0 !important; width: 100%; }
    th {
        background: #12191d !important;
        color: var(--ui-muted) !important;
        border-bottom: 1px solid var(--ui-line) !important;
        font-size: 0.7rem !important;
        letter-spacing: 0.08em !important;
        text-transform: uppercase !important;
    }
    td { border-bottom: 1px solid var(--ui-line-soft) !important; color: #d7ddd8 !important; }
    tr:last-child td { border-bottom: 0 !important; }
    tr:hover td { background: rgba(168, 213, 106, 0.035) !important; }
    code, pre, .mono, .id-code { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace !important; }
    code, pre, .result-box { background: #11181c !important; border-color: var(--ui-line) !important; }

    .flash, .flash-msg, .alert, .message {
        border-radius: 8px !important;
        border: 1px solid var(--ui-line) !important;
        background: #1c2527 !important;
        color: var(--ui-ink) !important;
    }
    .success, .flash.success { color: var(--ui-accent) !important; }
    .danger, .error, .flash.danger { color: var(--ui-danger) !important; }
    .warning { color: var(--ui-warm) !important; }

    .badge, .role-badge, .status-badge, .copy-chip {
        border-radius: 999px !important;
        font-size: 0.68rem !important;
        letter-spacing: 0.06em !important;
        text-transform: uppercase !important;
    }
    .avatar, .nav-icon { box-shadow: none !important; }
    .balance-hero {
        background: #1d252a !important;
        border: 1px solid #39464a !important;
        border-radius: 14px !important;
        box-shadow: var(--ui-shadow) !important;
    }
    .balance-hero::after { display: none !important; }
    .stat-card { padding: 20px !important; }
    .stat-icon { color: var(--ui-accent) !important; opacity: 0.75 !important; }
    .stat-label { color: var(--ui-muted) !important; letter-spacing: 0.08em !important; text-transform: uppercase !important; }
    .stat-value { color: var(--ui-ink) !important; }
    .status-pill.solved, .status-badge.status-completed { background: rgba(168, 213, 106, 0.12) !important; border-color: #6e9441 !important; color: var(--ui-accent) !important; }
    .status-pill.unsolved { background: rgba(152, 161, 159, 0.08) !important; border-color: #4b5658 !important; color: var(--ui-muted) !important; }
    .upload-zone, .upload-area { background: #131a1e !important; border: 1px dashed #4b5b5b !important; border-radius: 10px !important; }
    .upload-zone:hover, .upload-area:hover { border-color: var(--ui-accent) !important; background: rgba(168, 213, 106, 0.05) !important; }
    .upload-zone-icon { color: var(--ui-accent) !important; opacity: 0.8 !important; }
    .category-marker { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ui-accent); box-shadow: 0 0 0 4px rgba(168, 213, 106, 0.10); }

    @media (max-width: 760px) {
        .container { padding: 34px 18px 56px !important; }
        .card { padding: 20px !important; }
        h1 { font-size: 2.1rem !important; }
        table { display: block; overflow-x: auto; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
</style>
