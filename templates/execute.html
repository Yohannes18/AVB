<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="session-ref" content="{{ STUDENT_ID }}">
    <title>System Diagnostics – SecureBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;}
        .navbar{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;}
        .nav-brand{display:flex;align-items:center;gap:12px;}
        .nav-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:18px;}
        .nav-title{font-size:18px;font-weight:700;color:#fff;}
        .nav-links a{color:#94a3b8;text-decoration:none;margin-left:20px;font-size:14px;font-weight:500;transition:color .2s;}
        .nav-links a:hover{color:#fff;}
        .nav-user{display:flex;align-items:center;gap:10px;margin-left:20px;}
        .avatar-link{text-decoration:none;display:flex;align-items:center;}
        .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;transition:all .2s;border:2px solid transparent;}
        .avatar-link:hover .avatar{border-color:rgba(245,158,11,0.6);box-shadow:0 0 12px rgba(245,158,11,0.4);transform:scale(1.05);}
        .container{max-width:800px;margin:0 auto;padding:40px 24px;}
        h1{font-size:28px;font-weight:700;margin-bottom:8px;}
        .subtitle{color:#64748b;font-size:14px;margin-bottom:32px;}
        .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:32px;margin-bottom:24px;}
        .card-title{font-size:16px;font-weight:600;color:#f1f5f9;margin-bottom:20px;}
        label{display:block;color:#94a3b8;font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
        textarea{width:100%;padding:14px;border-radius:12px;background:#0f172a;border:1px solid rgba(255,255,255,0.08);color:#4ade80;font-family:'Courier New',monospace;font-size:14px;margin-bottom:16px;outline:none;resize:vertical;min-height:140px;}
        textarea:focus{border-color:rgba(251,146,60,.5);}
        .btn{padding:12px 24px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;font-family:'Inter',sans-serif;}
        .result-box{background:#0f172a;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:20px;margin-top:20px;}
        .result-box pre{color:#4ade80;font-size:13px;white-space:pre-wrap;word-break:break-all;}
    </style>
</head>
<body data-session-ref="{{ STUDENT_ID }}">
{% include 'navbar.html' %}
<div class="container">
    <h1>⚡ System Diagnostics & Expression Evaluator</h1>
    <p class="subtitle">Internal administration diagnostic tool.</p>

    <div class="card">
        <div class="card-title">Diagnostic Calculator</div>
        <form method="POST" action="/execute" id="execute-form">
            <label>Diagnostic Expression</label>
            <textarea name="code" id="code-input" placeholder="Enter expression..."></textarea>
            <button type="submit" class="btn">▶ Run Diagnostic</button>
        </form>
        {% if result %}
        <div class="result-box">
            <pre>{{ result }}</pre>
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
