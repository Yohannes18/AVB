<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="session-ref" content="{{ STUDENT_ID }}">
    <title>Reset Password – SecureBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(59,130,246,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.06) 1px,transparent 1px);background-size:60px 60px;}
        .card{position:relative;z-index:1;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:48px 40px;width:420px;box-shadow:0 40px 80px rgba(0,0,0,0.5);}
        h2{color:#f1f5f9;font-size:22px;font-weight:700;margin-bottom:6px;}
        .subtitle{color:#64748b;font-size:13px;margin-bottom:28px;}
        .flash{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;font-weight:500;}
        .flash.success{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.2);}
        .flash.error{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2);}
        label{display:block;color:#94a3b8;font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
        input{width:100%;padding:13px 16px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#f1f5f9;font-size:14px;margin-bottom:16px;outline:none;font-family:'Inter',sans-serif;}
        input:focus{border-color:rgba(59,130,246,.5);}
        .btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;}
        .links{margin-top:20px;text-align:center;font-size:13px;color:#64748b;}
        .links a{color:#3b82f6;text-decoration:none;}
    </style>
</head>
<body data-session-ref="{{ STUDENT_ID }}">
<div class="bg-grid"></div>
<div class="card">
    <h2>🔑 Reset Password</h2>
    <p class="subtitle">Recover access to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="/reset-password" id="reset-form">
        <label>Username</label>
        <input type="text" name="username" id="reset-username" placeholder="Enter username">
        <label>Security Answer</label>
        <input type="text" name="security_answer" id="security-answer" placeholder="Enter security answer">
        <label>New Password</label>
        <input type="password" name="new_password" id="new-password" placeholder="Enter new password">
        <button type="submit" class="btn">Reset Password</button>
    </form>
    <div class="links"><a href="/">← Back to Login</a></div>
</div>
</body>
</html>
