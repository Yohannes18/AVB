<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile - VulnBank</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 { color: #1e3a8a; margin-bottom: 30px; }
        label { display: block; margin: 15px 0 5px; font-weight: 600; color: #334155; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
        }
        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
        }
        .photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3b82f6;
            margin-bottom: 15px;
        }
        a { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✏️ My Profile</h1>
        
        <div style="text-align:center; margin-bottom:30px;">
            {% if user['profile_photo'] and user['profile_photo'] != 'default.png' %}
                <img src="/uploads/{{ user['profile_photo'] }}" class="photo" alt="Profile Photo">
            {% else %}
                <div class="photo" style="background:#e2e8f0; display:flex; align-items:center; justify-content:center; margin:0 auto;">
                    No Photo
                </div>
            {% endif %}
        </div>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="section">
                <h3>Update Name</h3>
                <label>Username</label>
                <input type="text" name="username" value="{{ user['username'] }}" required>
            </div>

            <div class="section">
                <h3>Profile Photo</h3>
                <label>Upload new photo</label>
                <input type="file" name="profile_photo" accept="image/*">
            </div>

            <div class="section">
                <h3>Change Password</h3>
                <label>Current Password</label>
                <input type="password" name="current_password">
                
                <label>New Password</label>
                <input type="password" name="new_password">
                
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password">
            </div>

            <button type="submit">Save Changes</button>
        </form>
        
        <p style="text-align:center; margin-top:25px;">
            <a href="/dashboard">← Back to Dashboard</a>
        </p>
    </div>
</body>
</html>
