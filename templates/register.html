<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureBank – Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; min-height: 100vh;
            background: #0a0f1e; display: flex; align-items: center;
            justify-content: center; overflow: hidden;
        }
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.06) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .glow-blob { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; }
        .glow-blob.blue   { width: 500px; height: 500px; background: rgba(59,130,246,0.12); top:-100px; left:-100px; }
        .glow-blob.purple { width: 400px; height: 400px; background: rgba(139,92,246,0.10); bottom:-80px; right:-80px; }
        .card {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.04); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 24px;
            padding: 48px 40px; width: 440px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .logo { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
        .logo-icon { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#3b82f6,#8b5cf6); display:flex; align-items:center; justify-content:center; font-size:22px; }
        .logo-text { color:#fff; font-size:20px; font-weight:700; }
        .logo-text span { color:#3b82f6; }
        h2 { color:#f1f5f9; font-size:24px; font-weight:700; margin-bottom:6px; }
        .subtitle { color:#64748b; font-size:14px; margin-bottom:28px; }
        .flash-msg { padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:16px; font-weight:500; }
        .flash-msg.error,.flash-msg.danger { background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.2); }
        .flash-msg.success { background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.2); }
        label { display:block; color:#94a3b8; font-size:12px; font-weight:500; letter-spacing:.5px; text-transform:uppercase; margin-bottom:6px; }
        input {
            width:100%; padding:13px 16px; border-radius:10px;
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
            color:#f1f5f9; font-size:14px; margin-bottom:16px;
            transition:border-color .2s,box-shadow .2s; outline:none; font-family:'Inter',sans-serif;
        }
        input:focus { border-color:rgba(59,130,246,.5); box-shadow:0 0 0 3px rgba(59,130,246,.1); }
        .btn-primary {
            width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer;
            background:linear-gradient(135deg,#3b82f6,#6366f1);
            color:#fff; font-size:15px; font-weight:600;
            transition:opacity .2s,transform .1s; font-family:'Inter',sans-serif;
        }
        .btn-primary:hover { opacity:.9; transform:translateY(-1px); }
        .links { margin-top:24px; text-align:center; color:#64748b; font-size:14px; }
        .links a { color:#3b82f6; text-decoration:none; font-weight:500; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-blob blue"></div>
    <div class="glow-blob purple"></div>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">🏦</div>
            <div class="logo-text">Secure<span>Bank</span></div>
        </div>
        <h2>Create account</h2>
        <p class="subtitle">Join SecureBank and get started today</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="flash-msg {{ category }}">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form action="/register" method="POST" id="register-form">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" name="username" placeholder="Choose a username" required>

            <label for="reg-email">Email</label>
            <input type="text" id="reg-email" name="email" placeholder="your@email.com" required>

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="password" placeholder="Create a password" required>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>
        <div class="links">Already have an account? <a href="/">Sign in</a></div>
    </div>
</body>
</html>
