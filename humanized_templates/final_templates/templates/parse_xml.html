<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="session-ref" content="{{ STUDENT_ID }}">
    <title>XML Data Ingestion – SecureBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0f1e;color:#e2e8f0;min-height:100vh;}
        .navbar{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;}
        .nav-brand{display:flex;align-items:center;gap:12px;}
        .nav-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center;font-size:18px;}
        .nav-title{font-size:18px;font-weight:700;color:#fff;}
        .nav-links a{color:#94a3b8;text-decoration:none;margin-left:20px;font-size:14px;font-weight:500;transition:color .2s;}
        .nav-links a:hover{color:#fff;}
        .nav-user{display:flex;align-items:center;gap:10px;margin-left:20px;}
        .avatar-link{text-decoration:none;display:flex;align-items:center;}
        .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#fb923c,#ea580c);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;transition:all .2s;border:2px solid transparent;}
        .avatar-link:hover .avatar{border-color:rgba(251,146,60,0.6);box-shadow:0 0 12px rgba(251,146,60,0.4);transform:scale(1.05);}
        .container{max-width:800px;margin:0 auto;padding:40px 24px;}
        h1{font-size:28px;font-weight:700;margin-bottom:8px;}
        .subtitle{color:#64748b;font-size:14px;margin-bottom:32px;}
        .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:32px;margin-bottom:24px;}
        .card-title{font-size:16px;font-weight:600;color:#f1f5f9;margin-bottom:20px;}
        pre{background:#0f172a;border-radius:10px;padding:14px;font-size:12px;color:#fdba74;overflow-x:auto;margin-top:8px;}
        textarea{width:100%;padding:14px;border-radius:12px;background:#0f172a;border:1px solid rgba(255,255,255,0.08);color:#fdba74;font-family:'Courier New',monospace;font-size:13px;margin-bottom:16px;outline:none;resize:vertical;min-height:180px;}
        textarea:focus{border-color:rgba(251,146,60,.5);}
        .btn{padding:12px 24px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600;background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;font-family:'Inter',sans-serif;}
    </style>
    {% include 'human_ui.html' %}
</head>
<body data-session-ref="{{ STUDENT_ID }}">
{% include 'navbar.html' %}
<div class="container">
    <h1> XML Data Processor</h1>
    <p class="subtitle">Process structured XML payload requests.</p>

    <div class="card">
        <div class="card-title">Submit XML Payload</div>
        <form method="POST" action="/parse-xml" id="xml-form" onsubmit="sendXML(event)">
            <textarea id="xml-input" placeholder="Paste XML payload here…">&lt;?xml version="1.0"?&gt;
&lt;root&gt;&lt;message&gt;Hello&lt;/message&gt;&lt;/root&gt;</textarea>
            <button type="submit" class="btn">Process XML Data</button>
        </form>
        <div id="xml-result" style="margin-top:20px;"></div>
    </div>
</div>
<script>
async function sendXML(e) {
    e.preventDefault();
    const xml = document.getElementById('xml-input').value;
    const resp = await fetch('/parse-xml', {
        method:'POST', headers:{'Content-Type':'application/xml'}, body:xml
    });
    const text = await resp.text();
    document.getElementById('xml-result').innerHTML =
        `<pre style="background:#0f172a;border-radius:10px;padding:16px;color:#4ade80;font-size:12px;overflow-x:auto;">${text.replace(/</g,'&lt;')}</pre>`;
}
</script>
</body>
</html>
